workflows:
  ios-release:
    name: Kitab Cloud iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: appstore_credentials
    environment:
      groups:
        - appstore_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: host.emergent.kitabcloud
    scripts:
      - name: Setup and Install
        script: |
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          cd "$TARGET_DIR"
          echo "Working in directory: $PWD"
          yarn install

      - name: Build React App
        script: |
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          cd "$TARGET_DIR"
          CI=false yarn build

      - name: Sync Capacitor
        script: |
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          cd "$TARGET_DIR"
          npx cap add ios || true
          npx cap sync ios

      - name: Update Bundle ID and Signing
        script: |
          PBXPROJ=$(find . -name "project.pbxproj" -not -path "*/node_modules/*" | head -n 1)
          echo "Found pbxproj at: $PBXPROJ"
          /usr/bin/sed -i.bak 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = host.emergent.kitabcloud;/g' "$PBXPROJ"
          /usr/bin/sed -i.bak 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' "$PBXPROJ"
          echo "Settings updated:"
          grep "PRODUCT_BUNDLE_IDENTIFIER\|CODE_SIGN_STYLE" "$PBXPROJ"

      - name: CocoaPods and Build
        script: |
          POD_DIR=$(find . -name "Podfile" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          cd "$POD_DIR"
          pod install
          cd ..

          WORKSPACE=$(find . -name "*.xcworkspace" -not -path "*/node_modules/*" | head -n 1)
          echo "Using workspace: $WORKSPACE"

          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme App \
            --export-options-plist /Users/builder/export_options.plist

          cat > /Users/builder/export_options.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>host.emergent.kitabcloud</key>
              <string>KitabCloud AppStore2</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme App \
            --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - "**/build/ios/ipa/*.ipa"
    publishing:
      app_store_connect:
        auth: integration
