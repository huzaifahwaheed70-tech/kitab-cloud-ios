workflows:
  ios-release:
    name: Kitab Cloud iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: appstore_credentials
    environment:
      groups:
        - appstore_credentials
      vars:
        REACT_APP_BACKEND_URL: "https://kitab-cloud.emergent.host"
    scripts:
      - name: Setup and Install
        script: |
          cd frontend
          yarn install --no-immutable

      - name: Install Certificate and Profile
        script: |
          keychain initialize
          echo $CM_CERTIFICATE | base64 --decode > /tmp/certificate.p12
          keychain add-certificates --pkcs12 /tmp/certificate.p12 --password "$CM_CERTIFICATE_PASSWORD"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo $CM_PROVISIONING_PROFILE | base64 --decode > /tmp/temp.mobileprovision
          UUID=$(grep -aA1 UUID /tmp/temp.mobileprovision | grep -oE "[-A-Z0-9]{36}")
          cp /tmp/temp.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Build React App
        script: |
          cd frontend
          REACT_APP_BACKEND_URL=https://kitab-cloud.emergent.host CI=false yarn build

      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS
        script: |
          cd frontend/ios/App
          pod install
          PROJ_PATH="Pods/Pods.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' "$PROJ_PATH"
          sed -i '' 's/CODE_SIGN_STYLE = Manual/CODE_SIGN_STYLE = Automatic/g' "$PROJ_PATH"
          sed -i '' '/ProvisioningStyle = Manual/d' "$PROJ_PATH"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 6" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.4" App/Info.plist
          ICON_SRC="/Users/builder/clone/assets/IMG_3931.png"
          ICONSET="App/Assets.xcassets/AppIcon.appiconset"
          if [ -f "$ICON_SRC" ]; then
            sips -z 1024 1024 "$ICON_SRC" --out "$ICONSET/AppIcon-1024@1x.png"
            sips -z 180 180 "$ICON_SRC" --out "$ICONSET/AppIcon-60@3x.png"
            sips -z 120 120 "$ICON_SRC" --out "$ICONSET/AppIcon-60@2x.png"
            sips -z 87 87 "$ICON_SRC" --out "$ICONSET/AppIcon-29@3x.png"
            sips -z 58 58 "$ICON_SRC" --out "$ICONSET/AppIcon-29@2x.png"
            sips -z 80 80 "$ICON_SRC" --out "$ICONSET/AppIcon-40@2x.png"
            sips -z 120 120 "$ICON_SRC" --out "$ICONSET/AppIcon-40@3x.png"
            sips -z 40 40 "$ICON_SRC" --out "$ICONSET/AppIcon-40@1x.png"
            sips -z 20 20 "$ICON_SRC" --out "$ICONSET/AppIcon-20@1x.png"
            sips -z 40 40 "$ICON_SRC" --out "$ICONSET/AppIcon-20@2x.png"
            sips -z 60 60 "$ICON_SRC" --out "$ICONSET/AppIcon-20@3x.png"
            sips -z 76 76 "$ICON_SRC" --out "$ICONSET/AppIcon-76@1x.png"
            sips -z 152 152 "$ICON_SRC" --out "$ICONSET/AppIcon-76@2x.png"
            sips -z 167 167 "$ICON_SRC" --out "$ICONSET/AppIcon-83.5@2x.png"
            cat > "$ICONSET/Contents.json" << 'ICONEOF'
            {
              "images": [
                { "filename": "AppIcon-20@1x.png", "idiom": "iphone", "scale": "1x", "size": "20x20" },
                { "filename": "AppIcon-20@2x.png", "idiom": "iphone", "scale": "2x", "size": "20x20" },
                { "filename": "AppIcon-20@3x.png", "idiom": "iphone", "scale": "3x", "size": "20x20" },
                { "filename": "AppIcon-29@2x.png", "idiom": "iphone", "scale": "2x", "size": "29x29" },
                { "filename": "AppIcon-29@3x.png", "idiom": "iphone", "scale": "3x", "size": "29x29" },
                { "filename": "AppIcon-40@2x.png", "idiom": "iphone", "scale": "2x", "size": "40x40" },
                { "filename": "AppIcon-40@3x.png", "idiom": "iphone", "scale": "3x", "size": "40x40" },
                { "filename": "AppIcon-60@2x.png", "idiom": "iphone", "scale": "2x", "size": "60x60" },
                { "filename": "AppIcon-60@3x.png", "idiom": "iphone", "scale": "3x", "size": "60x60" },
                { "filename": "AppIcon-20@1x.png", "idiom": "ipad", "scale": "1x", "size": "20x20" },
                { "filename": "AppIcon-20@2x.png", "idiom": "ipad", "scale": "2x", "size": "20x20" },
                { "filename": "AppIcon-29@1x.png", "idiom": "ipad", "scale": "1x", "size": "29x29" },
                { "filename": "AppIcon-29@2x.png", "idiom": "ipad", "scale": "2x", "size": "29x29" },
                { "filename": "AppIcon-40@1x.png", "idiom": "ipad", "scale": "1x", "size": "40x40" },
                { "filename": "AppIcon-40@2x.png", "idiom": "ipad", "scale": "2x", "size": "40x40" },
                { "filename": "AppIcon-76@1x.png", "idiom": "ipad", "scale": "1x", "size": "76x76" },
                { "filename": "AppIcon-76@2x.png", "idiom": "ipad", "scale": "2x", "size": "76x76" },
                { "filename": "AppIcon-83.5@2x.png", "idiom": "ipad", "scale": "2x", "size": "83.5x83.5" },
                { "filename": "AppIcon-1024@1x.png", "idiom": "ios-marketing", "scale": "1x", "size": "1024x1024" }
              ],
              "info": { "author": "xcode", "version": 1 }
            }
          ICONEOF
          fi
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -archivePath /Users/builder/archive.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            PRODUCT_BUNDLE_IDENTIFIER=host.emergent.kitabcloud \
            OTHER_CODE_SIGN_FLAGS="--keychain /Users/builder/Library/Keychains/codemagic.keychain"
          xcodebuild -exportArchive \
            -archivePath /Users/builder/archive.xcarchive \
            -exportOptionsPlist /Users/builder/clone/export_options.plist \
            -exportPath /Users/builder/export

    artifacts:
      - /Users/builder/export/*.ipa
    publishing:
      app_store_connect:
        auth: integration
