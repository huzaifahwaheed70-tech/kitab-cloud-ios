workflows:
  ios-release:
    name: Kitab Cloud iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: appstore_credentials

    environment:
      groups:
        - appstore_credentials
      vars:
        REACT_APP_BACKEND_URL: "https://kitab-cloud.emergent.host"
        APPLE_TEAM_ID: 6HUND32X2N
      ios_signing:
        distribution_type: app_store
        bundle_identifier: host.emergent.kitabcloud

    scripts:
      - name: Setup
        script: |
          cd frontend
          yarn install --no-immutable

      - name: Build React
        script: |
          cd frontend
          CI=false yarn build

      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS
        script: |
          cd frontend/ios/App

          pod install

          # Fix bundle ID everywhere
          /usr/bin/sed -i.bak 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = host.emergent.kitabcloud;/g' App.xcodeproj/project.pbxproj

          # Versioning
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 6" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.4" App/Info.plist

          # ---- CRITICAL FIX: PROPER UUID EXTRACTION ----
          PROFILE_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)

          echo "Using provisioning profile at: $PROFILE_PATH"

          security cms -D -i "$PROFILE_PATH" > profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" profile.plist)

          echo "Extracted UUID: $UUID"

          # ---- FIX PODS SIGNING ----
          sed -i.bak 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' Pods/Pods.xcodeproj/project.pbxproj
          sed -i.bak 's/PROVISIONING_PROFILE_SPECIFIER = .*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' Pods/Pods.xcodeproj/project.pbxproj
          sed -i.bak 's/PROVISIONING_PROFILE = .*;/PROVISIONING_PROFILE = "";/g' Pods/Pods.xcodeproj/project.pbxproj

          # ---- ARCHIVE (USING PROFILE NAME) ----
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -archivePath /Users/builder/archive.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            PRODUCT_BUNDLE_IDENTIFIER=host.emergent.kitabcloud \
            PROVISIONING_PROFILE_SPECIFIER="Dar-Us-Salam Kitab Cloud"

          # ---- EXPORT ----
          xcodebuild -exportArchive \
            -archivePath /Users/builder/archive.xcarchive \
            -exportOptionsPlist /Users/builder/clone/export_options.plist \
            -exportPath /Users/builder/export

    artifacts:
      - /Users/builder/export/*.ipa

    publishing:
      app_store_connect:
        auth: integration
