workflows:
  ios-release:
    name: Kitab Cloud iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: appstore_credentials
    environment:
      groups:
        - appstore_credentials
    scripts:
      - name: Install dependencies
        script: | 
          # This command finds where package.json is and moves there
          cd $(find . -name package.json -maxdepth 2 -not -path '*/.*' | xargs dirname)
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/ios
      - name: Build web app
        script: |
          cd $(find . -name package.json -maxdepth 2 -not -path '*/.*' | xargs dirname)
          mkdir -p www
          npm run build || true
      - name: Sync Capacitor
        script: |
          cd $(find . -name package.json -maxdepth 2 -not -path '*/.*' | xargs dirname)
          npx cap add ios || true
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          # Finds the iOS folder and installs pods
          cd $(find . -name Podfile -maxdepth 4 -not -path '*/.*' | xargs dirname)
          pod install
      - name: Build IPA
        script: |
          # Finds the workspace and builds
          WORKSPACE=$(find . -name "*.xcworkspace" | head -n 1)
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme App
    artifacts:
      - "**/build/ios/ipa/*.ipa"
    publishing:
      app_store_connect:
        auth: integration
