workflows:
  ios-release:
    name: Kitab Cloud iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: appstore_credentials

    environment:
      groups:
        - appstore_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: host.emergent.kitabcloud

    scripts:
      - name: Setup and Install
        script: |
          cd frontend
          yarn install

      - name: Build React App
        script: |
          cd frontend
          CI=false yarn build

      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS
        script: |
          set -e

          # Ensure APPLE_TEAM_ID is provided via Codemagic environment variables (UI)
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "ERROR: APPLE_TEAM_ID is not set. Add your Apple Team ID as an environment variable in Codemagic."
            exit 1
          fi

          cd frontend/ios/App
          pod install

          # Ensure bundle ID is correct in project file
          PBXPROJ="App.xcodeproj/project.pbxproj"
          /usr/bin/sed -i.bak 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = host.emergent.kitabcloud;/g' "$PBXPROJ"

          # Ensure Xcode uses Automatic signing and set the development team in the project file
          /usr/bin/sed -i.bak 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' "$PBXPROJ"
          if grep -q "DEVELOPMENT_TEAM" "$PBXPROJ"; then
            /usr/bin/sed -i.bak "s/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = $APPLE_TEAM_ID;/g" "$PBXPROJ"
          else
            /usr/bin/awk -v team="$APPLE_TEAM_ID" '{
              print;
              if ($0 ~ /PRODUCT_BUNDLE_IDENTIFIER = host.emergent.kitabcloud;/) {
                print "                DEVELOPMENT_TEAM = " team ";"
              }
            }' "$PBXPROJ" > "$PBXPROJ.tmp" && mv "$PBXPROJ.tmp" "$PBXPROJ"
          fi

          # Archive with automatic signing (allow Xcode to manage provisioning)
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -archivePath /Users/builder/archive.xcarchive \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -allowProvisioningUpdates \
            -skipPackagePluginValidation \
            EXCLUDED_ARCHS="" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

          # Export IPA using export_options.plist (automatic signing)
          xcodebuild -exportArchive \
            -archivePath /Users/builder/archive.xcarchive \
            -exportOptionsPlist /Users/builder/clone/export_options.plist \
            -exportPath /Users/builder/export

    artifacts:
      - /Users/builder/export/*.ipa

    publishing:
      app_store_connect:
        auth: integration
