workflows:
  ios-release:
    name: Kitab Cloud iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: appstore_credentials

    environment:
      groups:
        - appstore_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: host.emergent.kitabcloud

    scripts:
      - name: Setup and Install
        script: |
          cd frontend
          yarn install

      - name: Build React App
        script: |
          cd frontend
          CI=false yarn build

      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap sync ios

    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /Users/builder/export/*.ipa

    publishing:
      app_store_connect:
        auth: integration

    # 🔥 THIS IS THE KEY PART
    xcode:
      project: frontend/ios/App/App.xcworkspace
      scheme: App
