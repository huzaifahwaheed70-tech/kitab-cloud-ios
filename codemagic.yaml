workflows:
  ios-release:
    name: Kitab Cloud iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: appstore_credentials
    environment:
      groups:
        - appstore_credentials
      vars:
        REACT_APP_BACKEND_URL: "https://kitab-cloud.emergent.host"
    scripts:
      - name: Setup
        script: |
          cd frontend
          yarn install --no-immutable

      - name: Build React
        script: |
          cd frontend
          CI=false yarn build

      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS
        script: |
          # Install certificate - use the keychain that keychain initialize creates
          keychain initialize
          KEYCHAIN_PATH=$(security default-keychain | tr -d '"' | tr -d ' ')
          echo "Keychain path: $KEYCHAIN_PATH"

          echo $CM_CERTIFICATE | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CM_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/xcodebuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "" \
            "$KEYCHAIN_PATH"

          echo "Installed certificates:"
          security find-identity -v -p codesigning

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo $CM_PROVISIONING_PROFILE | base64 --decode > /tmp/profile.mobileprovision

          # Better UUID extraction
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i /tmp/profile.mobileprovision))
          echo "PROFILE UUID: $UUID"
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

          cd frontend/ios/App
          pod install

          # Fix Pods signing
          python3 /Users/builder/clone/fix_podfile.py

          # Fix bundle ID
          /usr/bin/sed -i.bak 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = host.emergent.kitabcloud;/g' App.xcodeproj/project.pbxproj

          # Remove old profile references
          /usr/bin/sed -i.bak2 '/PROVISIONING_PROFILE_SPECIFIER/d' App.xcodeproj/project.pbxproj
          /usr/bin/sed -i.bak3 '/PROVISIONING_PROFILE =/d' App.xcodeproj/project.pbxproj

          # Set Version 1.0.4 Build 6
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 6" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.4" App/Info.plist

          # Icon Generation
          ICON_SRC="/Users/builder/clone/assets/IMG_3931.png"
          ICONSET="App/Assets.xcassets/AppIcon.appiconset"
          if [ -f "$ICON_SRC" ]; then
            sips -z 1024 1024 "$ICON_SRC" --out "$ICONSET/AppIcon-1024@1x.png"
            sips -z 180 180 "$ICON_SRC" --out "$ICONSET/AppIcon-60@3x.png"
            sips -z 120 120 "$ICON_SRC" --out "$ICONSET/AppIcon-60@2x.png"
            sips -z 87 87 "$ICON_SRC" --out "$ICONSET/AppIcon-29@3x.png"
            sips -z 58 58 "$ICON_SRC" --out "$ICONSET/AppIcon-29@2x.png"
            sips -z 80 80 "$ICON_SRC" --out "$ICONSET/AppIcon-40@2x.png"
            sips -z 120 120 "$ICON_SRC" --out "$ICONSET/AppIcon-40@3x.png"
            sips -z 40 40 "$ICON_SRC" --out "$ICONSET/AppIcon-40@1x.png"
            sips -z 20 20 "$ICON_SRC" --out "$ICONSET/AppIcon-20@1x.png"
            sips -z 40 40 "$ICON_SRC" --out "$ICONSET/AppIcon-20@2x.png"
            sips -z 60 60 "$ICON_SRC" --out "$ICONSET/AppIcon-20@3x.png"
            sips -z 76 76 "$ICON_SRC" --out "$ICONSET/AppIcon-76@1x.png"
            sips -z 152 152 "$ICON_SRC" --out "$ICONSET/AppIcon-76@2x.png"
            sips -z 167 167 "$ICON_SRC" --out "$ICONSET/AppIcon-83.5@2x.png"
            sips -z 29 29 "$ICON_SRC" --out "$ICONSET/AppIcon-29@1x.png"
            cp /Users/builder/clone/Contents.json "$ICONSET/Contents.json"
            echo "Icons generated successfully"
          fi

          # Archive
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -archivePath /Users/builder/archive.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            PRODUCT_BUNDLE_IDENTIFIER=host.emergent.kitabcloud \
            PROVISIONING_PROFILE_SPECIFIER="$UUID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

          # Export
          xcodebuild -exportArchive \
            -archivePath /Users/builder/archive.xcarchive \
            -exportOptionsPlist /Users/builder/clone/export_options.plist \
            -exportPath /Users/builder/export

    artifacts:
      - /Users/builder/export/*.ipa
    publishing:
      app_store_connect:
        auth: integration
