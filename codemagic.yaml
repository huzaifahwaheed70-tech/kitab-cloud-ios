workflows:
  ios-release:
    name: Kitab Cloud iOS Build
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      groups:
        - appstore_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Setup and Install
        script: | 
          npm install -g @ionic/cli @capacitor/cli
          npm install
          
      - name: Build Web Assets
        script: |
          npm run build
          npx cap copy
          
      - name: Fix Assets and Icons
        script: |
          # Force create the iOS folder and generate icons
          npm install @capacitor/ios @capacitor/assets
          npx cap add ios || true
          
          # This command looks for 'assets/icon.png'
          npx @capacitor/assets generate --ios
          
          npx cap sync ios

      - name: CocoaPods and Signing Setup
        script: |
          cd ios/App && pod install && cd ../..
          PROVISIONING_PROFILE=$(ls /Users/builder/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          PROFILE_UUID=$(grep -aA1 "UUID" "$PROVISIONING_PROFILE" | grep -o "[-A-Z0-9]\{36\}")
          echo "Using Profile UUID: $PROFILE_UUID"

      - name: Build and Archive
        script: |
          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -archivePath /Users/builder/archive.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath /Users/builder/archive.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath /Users/builder/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

    artifacts:
      - /Users/builder/export/*.ipa
