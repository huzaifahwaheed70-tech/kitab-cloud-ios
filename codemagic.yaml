workflows:
  ios-release:
    name: Kitab Cloud iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: appstore_credentials
    environment:
      groups:
        - appstore_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: host.emergent.kitabcloud
      vars:
        REACT_APP_BACKEND_URL: "https://kitab-cloud.emergent.host"
    scripts:
      - name: Setup and Install
        script: |
          cd frontend
          yarn install --no-immutable

      - name: Build React App
        script: |
          cd frontend
          REACT_APP_BACKEND_URL=https://kitab-cloud.emergent.host CI=false yarn build

      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS
        script: |
          cd frontend/ios/App
          
          python3 /Users/builder/clone/fix_podfile.py Podfile
          pod install
          
          # Set Version and Build Number
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 5" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.4" App/Info.plist
          
          # Generate App Icons
          ICON_SRC="/Users/builder/clone/assets/IMG_3931.png"
          ICONSET="App/Assets.xcassets/AppIcon.appiconset"
          
          if [ -f "$ICON_SRC" ]; then
            sips -z 1024 1024 "$ICON_SRC" --out "$ICONSET/AppIcon-1024@1x.png"
            sips -z 180 180 "$ICON_SRC" --out "$ICONSET/AppIcon-60@3x.png"
            sips -z 120 120 "$ICON_SRC" --out "$ICONSET/AppIcon-60@2x.png"
            sips -z 87 87 "$ICON_SRC" --out "$ICONSET/AppIcon-29@3x.png"
            sips -z 58 58 "$ICON_SRC" --out "$ICONSET/AppIcon-29@2x.png"
            sips -z 80 80 "$ICON_SRC" --out "$ICONSET/AppIcon-40@2x.png"
            sips -z 120 120 "$ICON_SRC" --out "$ICONSET/AppIcon-40@3x.png"
            sips -z 40 40 "$ICON_SRC" --out "$ICONSET/AppIcon-40@1x.png"
            sips -z 20 20 "$ICON_SRC" --out "$ICONSET/AppIcon-20@1x.png"
            sips -z 40 40 "$ICON_SRC" --out "$ICONSET/AppIcon-20@2x.png"
            sips -z 60 60 "$ICON_SRC" --out "$ICONSET/AppIcon-20@3x.png"
            echo "Icons generated successfully"
            
            cat > "$ICONSET/Contents.json" << 'ICONEOF'
{
  "images": [
    { "filename": "AppIcon-20@1x.png", "idiom": "iphone", "scale": "1x", "size": "20x20" },
    { "filename": "AppIcon-20@2x.png", "idiom": "iphone", "scale": "2x", "size": "20x20" },
    { "filename": "AppIcon-20@3x.png", "idiom": "iphone", "scale": "3x", "size": "20x20" },
    { "filename": "AppIcon-29@2x.png", "idiom": "iphone", "scale": "2x", "size": "29x29" },
    { "filename": "AppIcon-29@3x.png", "idiom": "iphone", "scale": "3x", "size": "29x29" },
    { "filename": "AppIcon-40@2x.png", "idiom": "iphone", "scale": "2x", "size": "40x40" },
    { "filename": "AppIcon-40@3x.png", "idiom": "iphone", "scale": "3x", "size": "40x40" },
    { "filename": "AppIcon-60@2x.png", "idiom": "iphone", "scale": "2x", "size": "60x60" },
    { "filename": "AppIcon-60@3x.png", "idiom": "iphone", "scale": "3x", "size": "60x60" },
    { "filename": "AppIcon-1024@1x.png", "idiom": "ios-marketing", "scale": "1x", "size": "1024x1024" }
  ],
  "info": { "author": "xcode", "version": 1 }
}
ICONEOF
            echo "Contents.json updated"
          else
            echo "ERROR: Icon file not found at $ICON_SRC"
            ls /Users/builder/clone/assets/
          fi
          
          # Build Archive
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -archivePath /Users/builder/archive.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="96ff2b16-1462-4542-92fd-148e97cd2c44" \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            PRODUCT_BUNDLE_IDENTIFIER=host.emergent.kitabcloud \
            OTHER_CODE_SIGN_FLAGS="--keychain /Library/Keychains/System.keychain"
          
          APP_PATH="/Users/builder/archive.xcarchive/Products/Applications/App.app"
          
          # Fix framework bundle identifiers
          find "$APP_PATH/Frameworks" -name "Info.plist" | while read plist; do
            FRAMEWORK_NAME=$(basename $(dirname "$plist") .framework)
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $FRAMEWORK_NAME" "$plist" 2>/dev/null || true
          done
          
          # Re-sign frameworks
          find "$APP_PATH/Frameworks" -name "*.framework" -type d | while read framework; do
            codesign --force --sign "Apple Distribution: Omar Waheed ($APPLE_TEAM_ID)" \
              --keychain /Library/Keychains/System.keychain \
              "$framework"
          done
          
          # Re-sign main app
          ENTITLEMENTS=$(find /Users/builder/Library/Developer/Xcode/DerivedData -name "*.xcent" | head -n 1)
          codesign --force --sign "Apple Distribution: Omar Waheed ($APPLE_TEAM_ID)" \
            --keychain /Library/Keychains/System.keychain \
            --entitlements "$ENTITLEMENTS" \
            "$APP_PATH"
          
          # Create IPA
          mkdir -p /Users/builder/export/Payload
          cp -r "$APP_PATH" /Users/builder/export/Payload/
          cd /Users/builder/export
          zip -r App.ipa Payload
          echo "IPA created successfully"
    artifacts:
      - /Users/builder/export/App.ipa
    publishing:
      app_store_connect:
        auth: integration
