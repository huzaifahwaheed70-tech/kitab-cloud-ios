workflows:
  ios-release:
    name: Kitab Cloud iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: appstore_credentials
    environment:
      groups:
        - appstore_credentials
    scripts:
      - name: Install dependencies
        script: | 
          # If your files are in a folder, change 'cd .' to 'cd YOUR_FOLDER_NAME'
          cd . 
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/ios
      - name: Sync iOS Project
        script: |
          cd .
          npx cap add ios || true
          # We manually add the appId here just in case the config is missing
          npx cap init "Kitab Cloud" "com.kitabcloud.app" --web-dir www || true
          npx cap sync ios
      - name: Build IPA
        script: |
          cd .
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
