workflows:
  ios-release:
    name: Kitab Cloud iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: appstore_credentials
    environment:
      groups:
        - appstore_credentials
    scripts:
      - name: Setup and Install
        script: |
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          cd "$TARGET_DIR"
          echo "Working in directory: $PWD"
          yarn install

      - name: Build React App
        script: |
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          cd "$TARGET_DIR"
          CI=false yarn build

      - name: Sync Capacitor
        script: |
          TARGET_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          cd "$TARGET_DIR"
          npx cap add ios || true
          npx cap sync ios

      - name: CocoaPods and Build
        script: |
          POD_DIR=$(find . -name "Podfile" -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
          cd "$POD_DIR"
          pod install
          cd ..
          WORKSPACE=$(find . -name "*.xcworkspace" -not -path "*/node_modules/*" | head -n 1)
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme App

    artifacts:
      - "**/build/ios/ipa/*.ipa"
    publishing:
      app_store_connect:
        auth: integration
