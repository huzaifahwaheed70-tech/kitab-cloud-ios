workflows:
  ios-release:
    name: Kitab Cloud iOS Build
    instance_type: mac_mini
    max_build_duration: 60
    integrations:
      app_store_connect: appstore_credentials
    environment:
      groups:
        - appstore_credentials
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Sync iOS Project
        script: npx cap sync ios
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace ios/*.xcworkspace --scheme KitabCloud
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
