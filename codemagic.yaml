workflows:
  ios-release:
    name: Kitab Cloud iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: YOUR_FOLDER_NAME
    integrations:
      app_store_connect: appstore_credentials
    environment:
      groups:
        - appstore_credentials
    scripts:
      - name: Install dependencies
        script: | 
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/ios
      - name: Build web app
        script: |
          mkdir -p www
          npm run build || true
      - name: Sync Capacitor
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
