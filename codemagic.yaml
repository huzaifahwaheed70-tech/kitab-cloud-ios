workflows:
  ios-release:
    name: Kitab Cloud iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: appstore_credentials

    environment:
      groups:
        - appstore_credentials
      vars:
        REACT_APP_BACKEND_URL: "https://kitab-cloud.emergent.host"
        APPLE_TEAM_ID: 6HUND32X2N

      ios_signing:
        distribution_type: app_store
        bundle_identifier: host.emergent.kitabcloud

    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          yarn install --no-immutable

      - name: Build React app
        script: |
          cd frontend
          CI=false yarn build

      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd frontend/ios/App
          pod install

      - name: Build iOS (FIXED SIGNING)
        script: |
          cd frontend/ios/App

          # IMPORTANT: DO NOT touch Pods signing
          # DO NOT set manual provisioning profiles anywhere

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -archivePath /Users/builder/archive.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            PRODUCT_BUNDLE_IDENTIFIER=host.emergent.kitabcloud

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath /Users/builder/archive.xcarchive \
            -exportOptionsPlist /Users/builder/clone/export_options.plist \
            -exportPath /Users/builder/export

    artifacts:
      - /Users/builder/export/*.ipa

    publishing:
      app_store_connect:
        auth: integration
