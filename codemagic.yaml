workflows:
  ios-release:
    name: Kitab Cloud iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: appstore_credentials

    environment:
      groups:
        - appstore_credentials
      vars:
        REACT_APP_BACKEND_URL: "https://kitab-cloud.emergent.host"

    scripts:
      - name: Setup
        script: |
          cd frontend
          yarn install --no-immutable

      - name: Build React
        script: |
          cd frontend
          CI=false yarn build

      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS (AUTO SIGNING)
        script: |
          cd frontend/ios/App

          pod install

          # Force automatic signing
          /usr/bin/sed -i.bak 's/CODE_SIGN_STYLE = Manual/CODE_SIGN_STYLE = Automatic/g' App.xcodeproj/project.pbxproj
          /usr/bin/sed -i.bak2 '/PROVISIONING_PROFILE_SPECIFIER/d' App.xcodeproj/project.pbxproj
          /usr/bin/sed -i.bak3 '/PROVISIONING_PROFILE =/d' App.xcodeproj/project.pbxproj

          # Set bundle ID
          /usr/bin/sed -i.bak4 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = host.emergent.kitabcloud;/g' App.xcodeproj/project.pbxproj

          # Version
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 6" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.4" App/Info.plist

          # Build (AUTO SIGN)
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -archivePath /Users/builder/archive.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            -allowProvisioningUpdates

          # Export
          xcodebuild -exportArchive \
            -archivePath /Users/builder/archive.xcarchive \
            -exportOptionsPlist /Users/builder/clone/export_options.plist \
            -exportPath /Users/builder/export

    artifacts:
      - /Users/builder/export/*.ipa

    publishing:
      app_store_connect:
        auth: integration
