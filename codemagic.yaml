workflows:
  ios-release:
    name: Kitab Cloud iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Replace 'app' with your subfolder name if your code isn't in the root
    working_directory: . 
    integrations:
      app_store_connect: appstore_credentials
    environment:
      groups:
        - appstore_credentials
    scripts:
      - name: Install dependencies
        script: | 
          npm install
          npm install @capacitor/cli @capacitor/core @capacitor/ios
      - name: Sync iOS Project
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
