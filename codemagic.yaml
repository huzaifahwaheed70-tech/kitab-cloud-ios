workflows:
  ios-release:
    name: Kitab Cloud iOS Build

    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: appstore_credentials

    environment:
      groups:
        - appstore_credentials
      vars:
        APPLE_TEAM_ID: 6HUND32X2N

    scripts:
      - name: Install dependencies
        script: |
          cd frontend
          yarn install --no-immutable

      - name: Build React app
        script: |
          cd frontend
          CI=false yarn build

      - name: Add iOS platform
        script: |
          cd frontend
          npx cap add ios || true

      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd frontend/ios/App
          pod install

      - name: Build iOS (FINAL)
        script: |
          cd frontend/ios/App

          # Inject Team ID (CRITICAL)
          sed -i.bak "s/DEVELOPMENT_TEAM = \"\";/DEVELOPMENT_TEAM = $APPLE_TEAM_ID;/g" App.xcodeproj/project.pbxproj

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -archivePath /Users/builder/archive.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath /Users/builder/archive.xcarchive \
            -exportOptionsPlist /Users/builder/export_options.plist \
            -exportPath /Users/builder/export

    artifacts:
      - /Users/builder/export/*.ipa

    publishing:
      app_store_connect:
        auth: integration
