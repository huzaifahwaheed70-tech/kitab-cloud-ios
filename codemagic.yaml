workflows:
  ios-release:
    name: Kitab Cloud iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: appstore_credentials
    environment:
      groups:
        - appstore_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: host.emergent.kitabcloud
    scripts:
      - name: Setup and Install
        script: |
          cd frontend
          yarn install

      - name: Build React App
        script: |
          cd frontend
          CI=false yarn build

      - name: Sync Capacitor
        script: |
          cd frontend
          npx cap add ios || true
          npx cap sync ios

      - name: Set Build Number
        script: |
          cd frontend/ios/App
          CURRENT_BUILD=$(date +%s)
          /usr/bin/sed -i.bak "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $CURRENT_BUILD/" App.xcodeproj/project.pbxproj
          /usr/bin/sed -i.bak2 "s/MARKETING_VERSION = [0-9.]*/MARKETING_VERSION = 1.0.1/" App.xcodeproj/project.pbxproj
          echo "Build number set to: $CURRENT_BUILD"

      - name: Build iOS
        script: |
          cd frontend/ios/App
          pod install

          python3 << 'PYEOF'
import re

pods_pbxproj = "Pods/Pods.xcodeproj/project.pbxproj"
with open(pods_pbxproj, "r") as f:
    content = f.read()

content = re.sub(r'CODE_SIGN_STYLE = Manual;', 'CODE_SIGN_STYLE = Automatic;', content)
content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = "[^"]*";', 'PROVISIONING_PROFILE_SPECIFIER = "";', content)
content = re.sub(r"PROVISIONING_PROFILE_SPECIFIER = '[^']*';", "PROVISIONING_PROFILE_SPECIFIER = '';", content)
content = re.sub(r'CODE_SIGN_IDENTITY = "[^"]*";', 'CODE_SIGN_IDENTITY = "";', content)

with open(pods_pbxproj, "w") as f:
    f.write(content)

print("Pods signing fixed successfully")
PYEOF

          PBXPROJ="App.xcodeproj/project.pbxproj"
          /usr/bin/sed -i.bak3 's/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = host.emergent.kitabcloud;/g' "$PBXPROJ"

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -archivePath /Users/builder/archive.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Dar-Us-Salam Kitab Cloud" \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID \
            PRODUCT_BUNDLE_IDENTIFIER=host.emergent.kitabcloud

          xcodebuild -exportArchive \
            -archivePath /Users/builder/archive.xcarchive \
            -exportOptionsPlist /Users/builder/clone/export_options.plist \
            -exportPath /Users/builder/export

    artifacts:
      - /Users/builder/export/*.ipa
    publishing:
      app_store_connect:
        auth: integration
